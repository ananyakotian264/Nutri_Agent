services:
  - type: web
    name: nutri-agent-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: USDA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://nutri-agent-frontend.onrender.com
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: nutri-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nutri-agent-backend.onrender.com
